version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: db
    environment:
      MYSQL_DATABASE: bd-taller
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./ms-inventario/bd.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./ms-usuarios/bd.sql:/docker-entrypoint-initdb.d/2-init-users.sql
      - ./ms-usuarios/datos.sql:/docker-entrypoint-initdb.d/3-data-users.sql
      # Aquí incluyes también tus .sql del proyecto
      - ./proyecto/config/bs.sql:/docker-entrypoint-initdb.d/4-init-proyecto.sql
      - ./proyecto/config/data.sql:/docker-entrypoint-initdb.d/5-data-proyecto.sql
    networks:
      - app_network


  proyecto-php:
    build:
      context: ./proyecto
      dockerfile: Dockerfile
    container_name: proyecto-php
    depends_on:
      - db
    ports:
      - "8080:80"
    networks:
      - app_network
    environment:
      DB_HOST: db         # Nombre del servicio de MySQL
      DB_DATABASE: bd-taller
      DB_USER: root
      DB_PASSWORD: ""     # Contraseña vacía

  ms-inventario:
    build:
      context: ./ms-inventario
      dockerfile: Dockerfile
    container_name: ms-inventario
    depends_on:
      - db
    ports:
      - "5000:5000"
    networks:
      - app_network
    environment:
      DB_HOST: db
      DB_DATABASE: bd-taller
      DB_USER: root
      DB_PASSWORD: ""

  ms-usuarios:
    build:
      context: ./ms-usuarios
      dockerfile: Dockerfile
    container_name: ms-usuarios
    depends_on:
      - db
    ports:
      - "3000:3000"
    networks:
      - app_network
    environment:
      DB_HOST: db
      DB_DATABASE: bd-taller
      DB_USER: root
      DB_PASSWORD: ""

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front
    depends_on:
      - proyecto-php
      - ms-inventario
      - ms-usuarios
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://ms-inventario:5000
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data:
